name: 🚀 Nave espacial de contribuciones

on:
  # Se ejecuta todos los días a las 00:00 UTC (7:00 p.m. hora Colombia)
  schedule:
    - cron: "0 0 * * *"
  # Permite ejecutarlo a mano desde la pestaña Actions
  workflow_dispatch:
  # Se ejecuta cada vez que cambias el workflow o el script de meteoritos
  push:
    branches: [main]
    paths:
      - ".github/workflows/space-shooter.yml"
      - "scripts/meteoritos.py"

permissions:
  contents: write

jobs:
  generar-nave:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar gh-space-shooter
        run: pip install gh-space-shooter==2.0.5

      - name: Generar el GIF (nave disparando a meteoritos)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          python scripts/meteoritos.py Jlroja \
            --output assets/space-shooter.gif \
            --strategy random \
            --fps 30

      - name: Guardar el GIF en el repositorio
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/space-shooter.gif
          if git diff --staged --quiet; then
            echo "El GIF no cambió, no hay nada que guardar."
          else
            git commit -m "☄️ Actualizar nave y meteoritos"
            git push
          fi
