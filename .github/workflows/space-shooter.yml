name: 🤖 Robot y gólem de contribuciones

on:
  # Se ejecuta todos los días a las 00:00 UTC (7:00 p.m. hora Colombia)
  schedule:
    - cron: "0 0 * * *"
  # Permite ejecutarlo a mano desde la pestaña Actions
  workflow_dispatch:
  # Se ejecuta cada vez que cambias el workflow o el juego
  push:
    branches: [main]
    paths:
      - ".github/workflows/space-shooter.yml"
      - "scripts/constructor_golem.py"

permissions:
  contents: write

jobs:
  generar-juego:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        # gh-space-shooter se usa solo para descargar la gráfica de contribuciones
        run: pip install gh-space-shooter==2.0.5 pillow

      - name: Generar el GIF (robot constructor + gólem en pixel art)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          python scripts/constructor_golem.py Jlroja --output assets/constructor-golem.gif

      - name: Guardar el GIF en el repositorio
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/constructor-golem.gif
          if git diff --staged --quiet; then
            echo "El GIF no cambió, no hay nada que guardar."
          else
            git commit -m "🤖 Actualizar robot y gólem"
            git push
          fi
